name: Panel

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: panel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Test
        run: .venv/bin/pytest -q

  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: panel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: self-hosted
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clearcloud-panel:ci-${{ github.sha }} panel
      - name: Smoke test
        run: |
          name=panel-ci-${{ github.run_id }}
          docker run -d --rm --name "$name" clearcloud-panel:ci-${{ github.sha }}
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; docker image rm clearcloud-panel:ci-${{ github.sha }} >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$name" python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/api/setup/state').read().decode())"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$name"
          exit 1
