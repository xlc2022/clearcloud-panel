apiVersion: 1

# VictoriaMetrics speaks the Prometheus query API, so Grafana's built-in
# Prometheus datasource is used. Dashboards refer to it by uid.
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      prometheusType: Prometheus
      timeInterval: 30s
